<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131F24">
<meta name="apple-mobile-web-app-title" content="Brush Blast">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A tooth-brushing timer for kids: pick a theme, follow Chompy around the mouth, and win a sticker at the end.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #131F24; }</style>
</head>
<body>
<title>Brush Blast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-height phone-style column; each screen fills it, canvases do the animated parts.
   Deliberately single-theme (dark): every color is set explicitly. */
:root {
  color-scheme: dark;
  --dark: #131F24; --card: #202F36; --border: #37464F; --muted: #8FA3AD; --ink: #3C3C3C;
  --bubble-border: #E2E2E2; --white: #FFFFFF; --orange: #FF9A0A; --blue: #1FB2F5; --red: #FF5050; --red-lip: #D63636;
  --primary: #FF5050; --primary-lip: #D63636; --primary-light: #FF9A9A; --button-text: #FFFFFF;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--dark); color: var(--white); font-family: var(--font); font-weight: 800;
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }
#app { position: relative; z-index: 1; height: 100%; max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 12px; box-sizing: border-box; }
canvas { display: block; }
button { font-family: var(--font); cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
button:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

/* chunky 3D buttons */
.btn { position: relative; width: 100%; height: 58px; border-radius: 16px; font-size: 19px; font-weight: 900;
  letter-spacing: 0.06em; text-transform: uppercase; background: var(--primary); color: var(--button-text);
  box-shadow: 0 5px 0 var(--primary-lip); transition: transform .06s, box-shadow .06s; flex: none; }
.btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--primary-lip); }
.btn.outline { background: var(--card); color: var(--muted); border: 2.5px solid var(--border); box-shadow: 0 4px 0 var(--border); }
.btn.outline:active { box-shadow: 0 0 0 var(--border); transform: translateY(4px); }
.btn.danger { background: var(--red); box-shadow: 0 5px 0 var(--red-lip); color: var(--white); }
.btn:disabled { opacity: .7; }

/* speech bubble */
.bubble { position: relative; background: var(--white); color: var(--ink); border: 3px solid var(--bubble-border);
  border-radius: 18px; box-shadow: 0 4px 0 var(--bubble-border); padding: 12px 18px; font-size: 22px; font-weight: 900;
  text-align: center; line-height: 1.15; }
.bubble .sym { color: var(--primary); margin-right: 8px; font-family: system-ui, sans-serif; font-weight: 900; }
.bubble.tail-down::after { content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
  border: 13px solid transparent; border-top-color: var(--white); border-bottom: 0; }
.bubble.tail-left::after { content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  border: 13px solid transparent; border-right-color: var(--white); border-left: 0; }
.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* ---------- home ---------- */
#home .stats { display: flex; align-items: center; gap: 18px; font-size: 20px; padding-top: 6px; }
#home .stats .streak { color: var(--orange); }
#home .stats .book { color: var(--blue); }
#home .stats .spacer { flex: 1; }
.toggle { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.25); font-size: 18px; }
.toggle.off { opacity: .4; }
#home .hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
#home .hero .bubble { font-size: 19px; max-width: 320px; }
#homeMascot { width: 170px; height: 196px; }
.themes { display: flex; gap: 12px; overflow-x: auto; padding: 8px 2px 12px; margin: 0 -2px; scrollbar-width: none; flex: none; }
.themes::-webkit-scrollbar { display: none; }
.tile { flex: none; width: 118px; padding: 10px 8px 12px; border-radius: 20px; border: 2.5px solid var(--border);
  box-shadow: 0 5px 0 var(--border); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .15s; }
.tile canvas { width: 96px; height: 86px; }
.tile span { font-size: 15px; font-weight: 900; white-space: nowrap; }
.tile.sel { border-width: 4px; border-color: var(--primary); box-shadow: 0 5px 0 var(--primary-lip); transform: translateY(-4px); }
.durations { display: flex; gap: 10px; flex: none; }
.chip { flex: 1; height: 46px; border-radius: 14px; font-size: 18px; font-weight: 900; background: var(--card);
  color: var(--muted); border: 2.5px solid var(--border); box-shadow: 0 4px 0 var(--border); }
.chip.sel { background: var(--primary); color: var(--button-text); border-color: var(--primary); box-shadow: 0 4px 0 var(--primary-lip); }

/* ---------- brushing ---------- */
#brush .topbar { display: flex; align-items: center; gap: 12px; flex: none; }
.iconbtn { width: 44px; height: 44px; font-size: 26px; color: var(--muted); font-weight: 900; flex: none; }
.segs { flex: 1; display: flex; gap: 6px; }
.seg { flex: 1; height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; }
.seg i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 6px; }
#bubbleRow { flex: none; height: 78px; display: flex; align-items: center; justify-content: center; gap: 8px; }
#bubbleRow.side { justify-content: flex-start; }
#sideMascot { width: 72px; height: 83px; flex: none; }
#bubbleRow .bubble { max-width: 100%; }
#timerWrap { position: relative; flex: 1; min-height: 0; }
#timerCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); background: var(--white); color: var(--ink);
  border: 3px solid var(--bubble-border); box-shadow: 0 5px 0 var(--bubble-border); border-radius: 999px;
  font-size: 40px; font-weight: 900; padding: 0 24px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.pill.hurry { color: var(--red); }
#mouthCanvas { width: 100%; height: clamp(96px, 17vh, 150px); flex: none; }
#countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30;
  pointer-events: none; font-size: 200px; font-weight: 900; color: var(--primary); text-shadow: 0 14px 0 var(--primary-lip); }
#countdown span { animation: count .9s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes count { from { transform: scale(2.2); opacity: 0 } 40% { transform: scale(1); opacity: 1 } to { transform: scale(.9); opacity: 0 } }

/* sheets & overlays */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 28px 28px 0 0; box-sizing: border-box;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: slide .3s ease-out; }
@keyframes slide { from { transform: translateY(100%) } to { transform: none } }
.sheet .row { display: flex; align-items: center; gap: 14px; }
.sheet h2 { margin: 0; font-size: 24px; font-weight: 900; }
.sheet p { margin: 4px 0 0; color: var(--muted); font-size: 17px; font-weight: 700; }
#pauseMascot { width: 90px; height: 104px; flex: none; }

/* ---------- finale ---------- */
#finale h1 { margin: 24px 0 0; text-align: center; font-size: 40px; font-weight: 900; color: var(--primary);
  text-shadow: 0 3px 0 var(--primary-lip); flex: none; animation: slam .6s cubic-bezier(.3,1.5,.5,1) .15s both; text-wrap: balance; }
@keyframes slam { from { transform: scale(3); opacity: 0 } to { transform: none; opacity: 1 } }
#stage { position: relative; flex: 1; min-height: 0; touch-action: none; }
#stageCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#badge { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; }
#badge.show { animation: spinIn .9s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes spinIn { from { transform: scale(.01) rotate(-360deg) } to { transform: none } }
.badge { position: relative; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.badge .ring { position: absolute; inset: 7%; border-radius: 50%; border: 4px solid rgba(255,255,255,.85); }
.new { position: absolute; right: -6px; top: 4px; background: #FFCB05; color: #5A3D00; font-size: 18px; font-weight: 900;
  padding: 4px 12px; border-radius: 999px; box-shadow: 0 3px 0 #DDA704; transform: rotate(12deg); }
#finaleFooter { flex: none; display: flex; flex-direction: column; gap: 14px; }
.card { background: rgba(32,47,54,.92); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 12px; }
#footMascot { width: 80px; height: 92px; flex: none; }
.rarity { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.sname { font-size: 28px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.streakline { color: var(--orange); font-size: 16px; }
.shake { animation: shake .6s linear; }
@keyframes shake { 0%,100% { transform: none } 10% { transform: translate(-12px,4px) } 20% { transform: translate(11px,-5px) }
  30% { transform: translate(-9px,5px) } 40% { transform: translate(8px,-3px) } 55% { transform: translate(-5px,2px) } 70% { transform: translate(4px,-2px) } 85% { transform: translate(-2px,1px) } }
#flash { position: fixed; inset: 0; background: var(--white); z-index: 45; pointer-events: none; opacity: 0; }
#flash.on { animation: flash .7s ease-out; }
@keyframes flash { from { opacity: 1 } to { opacity: 0 } }

/* ---------- sticker book ---------- */
#book { position: fixed; inset: 0; z-index: 60; background: var(--dark); display: flex; flex-direction: column; }
#book header { display: flex; align-items: center; padding: 16px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px)); }
#book header h2 { flex: 1; margin: 0; font-size: 28px; font-weight: 900; }
#book .progress { margin: 6px 20px 0; height: 18px; border-radius: 9px; background: var(--border); overflow: hidden; }
#book .progress i { display: block; height: 100%; background: linear-gradient(90deg, #FFE46B, #FFCB05); border-radius: 9px; }
#book .count { text-align: center; color: var(--muted); font-size: 15px; padding-top: 6px; }
#book .list { flex: 1; overflow-y: auto; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 30px max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.bsec { background: var(--card); border: 2.5px solid var(--border); box-shadow: 0 4px 0 var(--border); border-radius: 22px; padding: 16px; }
.bsec h3 { margin: 0 0 12px; font-size: 22px; font-weight: 900; }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 16px; }
.bitem { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; text-align: center; min-width: 0; }
.bitem .nm { color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bitem .nm.unk { color: var(--muted); }
.bitem.hl { animation: bounce .4s ease-in-out 3 alternate .4s; }
@keyframes bounce { to { transform: scale(1.15) } }
.xn { position: absolute; right: -6px; top: -4px; background: var(--white); color: var(--ink); border-radius: 999px; padding: 1px 7px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .pop, .shake, #badge.show, #finale h1, #countdown span { animation-duration: .01s; } }
</style>

<canvas id="bg"></canvas>
<div id="app">
  <section class="screen" id="home">
    <div class="stats">
      <span class="streak" id="streak">🔥 0</span>
      <button class="book" id="bookBtn">📖 <span id="bookCount">0/48</span></button>
      <span class="spacer"></span>
      <button class="toggle" id="musicBtn" aria-label="Music on or off">🎵</button>
      <button class="toggle" id="voiceBtn" aria-label="Voice on or off">🗣️</button>
    </div>
    <div class="hero">
      <div class="bubble tail-down" id="tagline">Fill the whole board with marbles!</div>
      <canvas id="homeMascot"></canvas>
    </div>
    <div class="themes" id="themes"></div>
    <div class="durations" id="durations"></div>
    <button class="btn" id="startBtn">Start brushing</button>
  </section>

  <section class="screen" id="brush" hidden>
    <div class="topbar">
      <button class="iconbtn" id="quitBtn" aria-label="Pause">✕</button>
      <div class="segs" id="segs"></div>
    </div>
    <div id="bubbleRow">
      <canvas id="sideMascot"></canvas>
      <div class="bubble" id="zoneBubble"></div>
    </div>
    <div id="timerWrap">
      <canvas id="timerCanvas"></canvas>
      <div class="pill" id="pill">1:00</div>
    </div>
    <canvas id="mouthCanvas"></canvas>
    <button class="btn outline" id="pauseBtn">Pause</button>
  </section>

  <section class="screen" id="finale" hidden>
    <h1 id="finaleTitle">Board full!</h1>
    <div id="stage">
      <canvas id="stageCanvas"></canvas>
      <div id="badge" hidden></div>
    </div>
    <div id="finaleFooter"></div>
  </section>
</div>
<div id="countdown"></div>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div class="overlay" id="pauseSheet" hidden>
  <div class="sheet">
    <div class="row">
      <canvas id="pauseMascot"></canvas>
      <div><h2>Wait, don't stop now!</h2><p id="pauseText">Your teeth are 0% sparkly.</p></div>
    </div>
    <button class="btn" id="resumeBtn">Keep brushing</button>
    <button class="btn danger" id="endBtn">End session</button>
  </div>
</div>
<div id="book" hidden>
  <header><h2>Sticker book</h2><button class="iconbtn" id="bookClose" aria-label="Close">✕</button></header>
  <div class="progress"><i id="bookBar"></i></div>
  <div class="count" id="bookText"></div>
  <div class="list" id="bookList"></div>
</div>
<script src="app.js"></script>

</body>
</html>
